# Kept in lockstep with davkit-core and davkit-spring-boot-starter by hand; all three bump together at
# release. The starter is depended on at this exact version.
version=1.0.10-beta.1

# The plugin is built and tested against Grails 7. Grails 8 compatibility is validated in a real
# host before release.
grailsVersion=7.2.2

org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx1024M
